<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>STUN Public IP</title>
</head>

<body>
<pre id="out">INITIALIZING...</pre>

<script>
(async () => {
    const out = document.getElementById("out");

    const pc = new RTCPeerConnection({
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" }
        ]
    });

    pc.createDataChannel("ip");

    let publicIP = null;
    let done = false;

    function parseCandidate(cand) {
        const parts = cand.split(" ");

        const typeIndex = parts.indexOf("typ");
        const type = typeIndex !== -1 ? parts[typeIndex + 1] : null;

        const ip = parts[4];

        return { ip, type };
    }

    pc.onicecandidate = (e) => {
        if (!e.candidate || done) return;

        const { ip, type } = parseCandidate(e.candidate.candidate);

        // ONLY STUN-derived public IP
        if (type === "srflx" && ip && !ip.endsWith(".local")) {
            publicIP = ip;
        }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // wait for ICE gathering
    setTimeout(() => {
        done = true;
        pc.close();

        if (publicIP) {
            out.textContent = publicIP;
        } else {
            out.textContent = "ERROR: NO_STUN_PUBLIC_IP\n(WebRTC did not expose srflx candidate)";
        }
    }, 4000);
})();
</script>

</body>
</html>
